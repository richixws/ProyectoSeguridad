keycloak.issuer=http://localhost:8080/realms/demo
keycloak.base-uri=http://localhost:8080/auth/realms/
keycloak.authorization-uri=http://localhost:8080/realms/demo/protocol/openid-connect/auth
keycloak.user-info-uri=http://localhost:8080/realms/demo/protocol/openid-connect/userinfo
keycloak.token-uri=http://localhost:8080/realms/demo/protocol/openid-connect/token
keycloak.logout=http://localhost:8080/realms/demo/protocol/openid-connect/logout
keycloak.jwk-set-uri=http://localhost:8080/realms/demo/protocol/openid-connect/certs
keycloak.client-id=seguridad-demo

keycloak.authorization-grant-type=password
keycloak.authorization-grant-type-refresh=refresh_token

logging.level.org.keycloak=DEBUG
# ARCHIVOS
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

eureka.client.enabled=false
app.storage.location=mediafile

#PROFILES
spring.profiles.active=dev